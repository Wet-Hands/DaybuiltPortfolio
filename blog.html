<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Day</title>
<link rel="stylesheet" href="main.css">
<style>
  /* ── BLOG PAGE ────────────────────────────────────────────────────────── */

  /* Two-pane layout: post list left, reading pane right                     */
  .blog-panes {
    display: grid;
    grid-template-columns: 320px 1fr;
    /* Fill viewport minus taskbar + title-bar + toolbar + status-bar + padding */
    height: calc(100vh - 178px);
    min-height: 300px;
  }

  /* ── POST LIST (left pane) ──────────────────────────────────────────────── */
  .blog-list-pane {
    border-right: 1px solid #808080;
    box-shadow: 1px 0 0 #fff;
    overflow-y: auto;
    background: #fff;
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
  }

  /* ── TOOLBAR (tag filter) ───────────────────────────────────────────────── */
  .blog-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; font-size: 11px;
  }
  .blog-toolbar select {
    font-family: 'Win95', Arial, sans-serif; font-size: 11px;
    background: #fff; color: #000; padding: 1px 2px;
    border: 2px solid; border-color: #404040 #fff #fff #404040;
    border-radius: 0;
  }

  /* Year group header inside the post list */
  .blog-year-row {
    padding: 2px 6px; font-size: 11px; font-weight: bold;
    background: #e0e0e0; border-bottom: 1px solid #c0c0c0;
    position: sticky; top: 21px; /* below the 21px column header */
  }

  /* Column header bar */
  .blog-list-header {
    display: grid;
    grid-template-columns: 1fr 80px;
    background: #c0c0c0;
    border-bottom: 2px solid #404040;
    font-weight: bold; font-size: 11px;
    user-select: none; position: sticky; top: 0;
  }
  .blog-list-header div {
    padding: 2px 6px;
    border-right: 1px solid #808080;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
  }
  .blog-list-header div:last-child { border-right: none; }

  /* Individual post row */
  .blog-post-row {
    display: grid;
    grid-template-columns: 1fr 80px;
    border-bottom: 1px solid #c0c0c0;
    cursor: pointer; font-size: 13px;
  }
  .blog-post-row:hover,
  .blog-post-row.selected { background: #000080; color: #fff; }
  .blog-post-row > div  { padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .blog-post-row:focus-visible { outline-offset: -3px; }  /* inside, so the pane doesn't clip it */
  .blog-post-row .post-date-col { font-size: 10px; text-align: right; opacity: 0.8; }

  /* ── READING PANE (right pane) ──────────────────────────────────────────── */
  .blog-reading-pane {
    overflow-y: auto;
    background: #fff;
    border-top: 2px solid #404040;
    border-right: 2px solid #fff;
  }

  /* Empty state */
  .blog-empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #808080; font-size: 12px; gap: 8px;
  }
  .blog-empty-icon { font-size: 32px; }

  /* Post header inside reading pane */
  .post-header {
    padding: 10px 12px 6px;
    border-bottom: 1px solid #c0c0c0;
    background: #f0f0f0;
  }
  .post-header h2 { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
  .post-meta {
    display: flex; gap: 12px; font-size: 11px; color: #444;
    align-items: center; flex-wrap: wrap;
  }
  .post-content {
    padding: 12px;
    font-size: 14px;
    line-height: 1.7;
  }
  .post-content p   { margin-bottom: 14px; }
  .post-content p:last-child { margin-bottom: 0; }
  .post-content h3  { font-size: 14px; font-weight: bold; margin: 10px 0 6px; }
  .post-content ul  { margin: 0 0 10px 18px; }
  .post-content li  { margin-bottom: 4px; }
  .post-content code {
    background: #e8e8e8; padding: 1px 4px;
    font-family: monospace; font-size: 11px;
  }
  .post-content pre {
    background: #1a1a2e; color: #e0e0ff;
    padding: 8px; font-family: monospace; font-size: 12px;
    overflow-x: auto; margin-bottom: 10px;
  }

  /* Tags in reading pane */
  .post-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .post-tag, .post-link-btn {
    background: #c0c0c0; color: inherit;
    border: 1px solid; border-color: #fff #404040 #404040 #fff;
    padding: 1px 6px; font-size: 11px; font-family: inherit;
    cursor: pointer;
  }
  .post-tag:hover, .post-link-btn:hover { background: #d0d0d0; }
  .post-tag:active, .post-link-btn:active { border-color: #404040 #fff #fff #404040; }
  .post-link-btn { margin-left: auto; }

  /* ── POST IMAGES (click to open in lightbox) ────────────────────────────── */
  .post-img {
    cursor: zoom-in;
    border: 2px solid; border-color: #404040 #fff #fff #404040;
  }
  .post-img-float { float: left; width: 45%; margin: 0 0 8px 12px; }
  .post-img-row   { display: flex; gap: 8px; margin: 8px 0; }
  .post-img-row .post-img { width: 50%; }
  .clear { clear: both; }

  @media (max-width: 600px) {
    .blog-panes { grid-template-columns: 1fr; height: auto; }
    .blog-list-pane { height: 200px; border-right: none; border-bottom: 1px solid #808080; }
    .blog-reading-pane { height: 400px; }
  }
</style>
</head>
<body>

<div class="desktop">

  <!-- ── BLOG WINDOW ───────────────────────────────────────────────────── -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-left">
        <svg class="title-icon" viewBox="0 0 16 16">
          <rect x="2" y="1" width="12" height="14" fill="none" stroke="#fff" stroke-width="1.5"/>
          <line x1="4" y1="5"  x2="12" y2="5"  stroke="#fff" stroke-width="1"/>
          <line x1="4" y1="8"  x2="12" y2="8"  stroke="#fff" stroke-width="1"/>
          <line x1="4" y1="11" x2="8"  y2="11" stroke="#fff" stroke-width="1"/>
        </svg>
        Blog.exe
      </div>
      <div class="title-bar-buttons">
        <div class="win-btn">_</div>
        <div class="win-btn">&#9633;</div>
        <div class="win-btn">&#x2715;</div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="blog-toolbar">
      <label for="tag-filter">Filter:</label>
      <select id="tag-filter">
        <option value="">All tags</option>
      </select>
    </div>

    <!-- Two-pane layout -->
    <div class="blog-panes">

      <!-- Left: post list -->
      <div class="blog-list-pane">
        <div class="blog-list-header">
          <div>Title</div>
          <div>Date</div>
        </div>
        <div id="post-list" role="listbox" aria-label="Posts"></div>
      </div>

      <!-- Right: reading pane -->
      <div class="blog-reading-pane" id="reading-pane">
        <div class="blog-empty-state" id="empty-state">
          <span class="blog-empty-icon">&#128221;</span>
          <span>Select a post to read</span>
        </div>
        <div id="post-content-area" style="display:none;"></div>
      </div>

    </div>

    <div class="status-bar">
      <div class="status-panel" id="blog-count">0 post(s)</div>
      <div class="status-panel" id="blog-selected">No file selected</div>
    </div>
  </div>

</div><!-- /.desktop -->

<!-- ── TASKBAR ──────────────────────────────────────────────────────────── -->
<div class="taskbar">
  <button class="start-btn">
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" fill="#f00"/><rect x="9" y="1" width="6" height="6" fill="#0f0"/><rect x="1" y="9" width="6" height="6" fill="#00f"/><rect x="9" y="9" width="6" height="6" fill="#ff0"/></svg>
    Start
  </button>
  <div class="taskbar-divider"></div>
  <a class="taskbar-link" href="index.html">&#128196; My Portfolio</a>
  <a class="taskbar-link" href="resume.html">&#128196; Resume.pdf</a>
  <a class="taskbar-link active" href="blog.html">&#128221; Blog.exe</a>
  <a class="taskbar-link" href="games.html">&#127918; Games.exe</a>
  <div class="taskbar-clock" id="clock">00:00</div>
</div>

<!-- ── LIGHTBOX ─────────────────────────────────────────────────────────── -->
<div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
  <div class="lightbox-win" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="title-bar">
      <div class="title-bar-left">&#128444; Image Viewer</div>
      <div class="title-bar-buttons">
        <div class="win-btn" onclick="closeLightbox()" role="button" tabindex="0" aria-label="Close image viewer">&#x2715;</div>
      </div>
    </div>
    <div class="lightbox-body">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div class="lightbox-statusbar">
      <div class="status-panel" id="lightbox-caption"></div>
    </div>
  </div>
</div>

<!-- blog.js defines the blogPosts array -->
<script src="blog.js"></script>
<script src="common.js"></script>
<script>
  var listEl      = document.getElementById('post-list');
  var readingPane = document.getElementById('reading-pane');
  var tagFilter   = document.getElementById('tag-filter');

  var activeTag  = '';     // '' = show all posts
  var selectedId = null;   // id of the post in the reading pane

  // Sort newest first
  var posts = blogPosts.slice().sort(function(a, b) {
    return new Date(b.date) - new Date(a.date);
  });

  function findPost(id) {
    return posts.find(function(p) { return p.id === id; });
  }

  // '2025-06-01' → 'Jun 01' (list) / 'June 1, 2025' (reading pane)
  function fmtDate(iso, options) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', options);
  }


  // ── TAG FILTER ─────────────────────────────────────────────────────────────
  // Options list every tag with its post count, most used first.
  var tagCounts = {};
  posts.forEach(function(p) {
    p.tags.forEach(function(t) { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  Object.keys(tagCounts)
    .sort(function(a, b) { return tagCounts[b] - tagCounts[a] || a.localeCompare(b); })
    .forEach(function(t) {
      tagFilter.add(new Option(t + ' (' + tagCounts[t] + ')', t));
    });

  tagFilter.addEventListener('change', function() { setFilter(tagFilter.value); });

  function setFilter(tag) {
    activeTag = tag;
    tagFilter.value = tag;
    var visible = renderList();
    // Keep the open post if it is still listed, otherwise open the newest match
    if (!visible.some(function(p) { return p.id === selectedId; }) && visible.length) {
      selectPost(visible[0]);
    }
  }


  // ── POST LIST ──────────────────────────────────────────────────────────────
  // Rebuilds the list for the active tag, grouped under year headers.
  // Returns the posts that are shown.
  function renderList() {
    var visible = posts.filter(function(p) { return !activeTag || p.tags.indexOf(activeTag) !== -1; });
    var year = null;
    listEl.innerHTML = '';

    visible.forEach(function(post) {
      if (post.date.slice(0, 4) !== year) {
        year = post.date.slice(0, 4);
        var yearRow = document.createElement('div');
        yearRow.className = 'blog-year-row';
        yearRow.setAttribute('aria-hidden', 'true');
        yearRow.textContent = year;
        listEl.appendChild(yearRow);
      }
      var row = document.createElement('div');
      row.className = 'blog-post-row' + (post.id === selectedId ? ' selected' : '');
      row.dataset.id = post.id;
      row.setAttribute('role', 'option');
      row.title = post.summary;
      row.innerHTML =
        '<div>&#128196; ' + post.title + '</div>' +
        '<div class="post-date-col">' + fmtDate(post.date, { month: 'short', day: '2-digit' }) + '</div>';
      row.addEventListener('click', function() { selectPost(post); });
      listEl.appendChild(row);
    });

    updateRowStates();
    document.getElementById('blog-count').textContent = activeTag
      ? visible.length + ' of ' + posts.length + ' post(s)'
      : posts.length + ' post(s)';
    return visible;
  }


  // ── READING PANE ───────────────────────────────────────────────────────────
  // Selected row is highlighted and is the list's single Tab stop
  // (falls back to the first row when the selected post is filtered out).
  function updateRowStates() {
    var rows = listEl.querySelectorAll('.blog-post-row');
    var hasSelected = Array.prototype.some.call(rows, function(row) { return row.dataset.id === selectedId; });
    rows.forEach(function(row, i) {
      var selected = row.dataset.id === selectedId;
      row.classList.toggle('selected', selected);
      row.setAttribute('aria-selected', selected);
      row.tabIndex = selected || (!hasSelected && i === 0) ? 0 : -1;
    });
  }

  // Up / Down / Home / End move through the list and open the post
  listEl.addEventListener('keydown', function(e) {
    var rows = Array.prototype.slice.call(listEl.querySelectorAll('.blog-post-row'));
    var i = rows.indexOf(document.activeElement);
    var next = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: rows.length - 1 }[e.key];
    if (next === undefined || !rows[next]) return;
    e.preventDefault();
    selectPost(findPost(rows[next].dataset.id));
    focusElement(rows[next]);
    rows[next].scrollIntoView({ block: 'nearest' });
  });

  function selectPost(post) {
    selectedId = post.id;
    updateRowStates();
    // Give every post a shareable link: blog.html#<id>
    history.replaceState(null, '', '#' + post.id);
    openPost(post);
  }

  function openPost(post) {
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('blog-selected').textContent = post.title;

    var area = document.getElementById('post-content-area');
    area.style.display = 'block';
    area.innerHTML =
      '<div class="post-header">' +
        '<h2>' + post.title + '</h2>' +
        '<div class="post-meta">' +
          '<span>&#128197; ' + fmtDate(post.date, { year: 'numeric', month: 'long', day: 'numeric' }) + '</span>' +
          '<span class="post-tags">' +
            post.tags.map(function(t) {
              return '<button class="post-tag" data-tag="' + t + '" title="Show all ' + t + ' posts">' + t + '</button>';
            }).join('') +
          '</span>' +
          '<button class="post-link-btn" title="Copy a link to this post">&#128279; Copy link</button>' +
        '</div>' +
      '</div>' +
      '<div class="post-content">' + post.content + '</div>';

    // Post images open in the lightbox; make them reachable by keyboard too
    area.querySelectorAll('img.post-img').forEach(function(img) {
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
    });

    readingPane.scrollTop = 0;
  }

  readingPane.addEventListener('click', function(e) {
    var el = e.target;
    if (el.matches('img.post-img')) {
      openLightbox(el.src, el.alt);           // post images open in the lightbox
    } else if (el.matches('.post-tag')) {
      setFilter(el.dataset.tag);              // tags filter the list
    } else if (el.matches('.post-link-btn')) {
      copyLink(el);
    }
  });

  function copyLink(btn) {
    var url = location.href;
    var done = function() { btn.innerHTML = '&#10004; Copied'; };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(done, function() { window.prompt('Copy this link:', url); });
    } else {
      window.prompt('Copy this link:', url);
    }
  }


  // ── STARTUP ────────────────────────────────────────────────────────────────
  // Open the post named in the URL hash, or the newest post.
  function openFromHash() {
    var post = findPost(location.hash.slice(1)) || posts[0];
    if (!post) return;
    if (activeTag && post.tags.indexOf(activeTag) === -1) {
      activeTag = '';
      tagFilter.value = '';
      renderList();
    }
    selectPost(post);
    var row = listEl.querySelector('.selected');
    if (row) row.scrollIntoView({ block: 'nearest' });
  }

  window.addEventListener('hashchange', openFromHash);
  renderList();
  openFromHash();
</script>
</body>
</html>
